<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: cabeza('Inicio')}"></head>
<body>
<aside th:replace="~{fragmentos :: menu('inicio')}"></aside>
<main>
    <p class="fecha" th:text="${#temporals.format(#temporals.createNow(), 'EEEE d ''de'' MMMM, yyyy')}">jueves 26 de noviembre, 2026</p>
    <h1>Resumen del condominio</h1>

    <!-- un solo panel con los numeros del dia -->
    <section class="resumen">
        <a class="dato" th:href="@{/panel/residentes}">
            <span class="numero" th:text="${totalResidentes}">0</span>
            <span>Residentes</span>
        </a>
        <a class="dato" th:href="@{/panel/pases}">
            <span class="numero" th:text="${pasesActivos}">0</span>
            <span>Pases activos</span>
        </a>
        <a class="dato" th:href="@{/panel/bitacora}">
            <span class="numero" th:text="${accesosHoy}">0</span>
            <span>Escaneos de hoy</span>
        </a>
        <div class="dato" th:classappend="${pendientes > 0} ? 'pendiente'">
            <span class="numero" th:text="${pendientes}">0</span>
            <span>Visitas por aprobar</span>
        </div>
    </section>

    <section class="atajo">
        <div>
            <h2>¿Llegó alguien a la caseta?</h2>
            <p>Escanea su pase con la cámara y el sistema registra la entrada o la salida.</p>
        </div>
        <a class="boton" th:href="@{/panel/escanear}">Escanear pase</a>
    </section>

    <p class="nota">La documentación del API está en <a th:href="@{/swagger-ui.html}">Swagger</a>.</p>
</main>
</body>
</html>
