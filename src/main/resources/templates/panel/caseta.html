<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragmentos :: cabeza('Caseta')}"></head>
<!-- la caseta usa el tema oscuro (vigilancia) -->
<body class="vigilancia">
<aside th:replace="~{fragmentos :: menu('caseta')}"></aside>
<main>
    <h1>Caseta de vigilancia</h1>
    <div th:replace="~{fragmentos :: avisos}"></div>

    <p class="acciones"><a class="boton" th:href="@{/panel/escanear}">Escanear con la cámara</a></p>

    <div class="fila">
        <form class="caja" method="post" th:action="@{/panel/caseta}">
            <h2>Escribir código</h2>
            <input name="codigo" placeholder="Código del pase" required autofocus>
            <button type="submit">Validar</button>
        </form>
        <form class="caja" method="post" th:action="@{/panel/caseta/imagen}" enctype="multipart/form-data">
            <h2>Subir foto del QR</h2>
            <input name="imagen" type="file" accept="image/*" required>
            <button type="submit">Validar</button>
        </form>
    </div>

    <div th:if="${resultado}" class="resultado"
         th:classappend="${resultado.resultado.name() == 'PERMITIDO'} ? 'permitido' : 'denegado'">
        <h2 th:text="${resultado.resultado}">PERMITIDO</h2>
        <p><strong th:text="${resultado.titular != null ? resultado.titular : 'Desconocido'}">Ana</strong>
            <span th:if="${resultado.tipoPase}" th:text="'· ' + ${#strings.toLowerCase(resultado.tipoPase)}"></span></p>
        <p th:text="${resultado.motivo}">ENTRADA - Entrada registrada</p>
        <p class="nota" th:text="${#temporals.format(resultado.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></p>
    </div>

    <!-- llega alguien que no tiene pase: se registra y el residente decide -->
    <form class="caja visita-sin-qr" method="post" th:action="@{/panel/caseta/visita}" enctype="multipart/form-data">
        <h2>Llegó alguien sin pase</h2>
        <div class="campos">
            <label>Nombre de la visita <input name="nombreVisitante" required></label>
            <label>Tipo
                <select name="tipo">
                    <option th:each="t : ${tiposVisita}" th:value="${t}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(t))}">Visita</option>
                </select>
            </label>
            <label>Viene a ver a
                <select name="residenteId" required>
                    <option th:each="r : ${residentes}" th:value="${r.id}" th:text="${r.nombre + ' (' + r.departamento + ')'}">Ana</option>
                </select>
            </label>
        </div>
        <div class="campos dos">
            <label>Motivo <input name="motivo" placeholder="Opcional"></label>
            <label>Foto de la visita o su identificación <input name="foto" type="file" accept="image/jpeg,image/png,image/webp"></label>
        </div>
        <button type="submit">Registrar y avisar al residente</button>
    </form>
</main>
</body>
</html>
