spring.application.name=condominios-acceso-qr
server.port=8080

# Credenciales locales: se leen de secrets.properties (no se sube a GitHub)
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:condominios_acceso}?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:cambia-esto}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
