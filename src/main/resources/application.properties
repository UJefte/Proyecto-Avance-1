spring.application.name=condominios-acceso-qr
# Railway pone el puerto en la variable PORT, en local usa 8080
server.port=${PORT:8080}

# Si quieres poner tus datos de Neon sin variables de entorno, crea local.properties
# (copia local.properties.example). Ese archivo no se sube a GitHub.
spring.config.import=optional:classpath:local.properties

# Base de datos Postgres. Por defecto apunta al Postgres del docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/condominios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Datos de ejemplo al arrancar (departamentos, residentes, trabajador y sus pases)
app.datos-semilla=${DATOS_SEMILLA:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Para revisar que el servidor esta vivo: GET /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# que no salga ;jsessionid=... en las direcciones del panel
server.servlet.session.tracking-modes=cookie
