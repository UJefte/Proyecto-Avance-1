spring.application.name=condominios-acceso-qr
# Railway pone el puerto en la variable PORT, en local usa 8080
server.port=${PORT:8080}

# Si quieres poner tus datos de Neon sin variables de entorno, crea local.properties
# (copia local.properties.example). Ese archivo no se sube a GitHub.
spring.config.import=optional:classpath:local.properties

# Base de datos Postgres. Por defecto apunta al Postgres del docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/condominios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Datos de ejemplo al arrancar (departamentos, residentes, trabajador y sus pases)
app.datos-semilla=${DATOS_SEMILLA:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Para revisar que el servidor esta vivo: GET /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# que no salga ;jsessionid=... en las direcciones del panel
server.servlet.session.tracking-modes=cookie

# fechas del panel en espanol
spring.web.locale=es_MX
spring.web.locale-resolver=fixed

# fotos de las visitas: se guardan en esta carpeta
app.carpeta-imagenes=${CARPETA_IMAGENES:imagenes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# correo. Si CORREO_ACTIVO=false solo se escribe en el log.
# En docker-compose se usa Mailpit (buzon de prueba en http://localhost:8025)
app.correo.activo=${CORREO_ACTIVO:false}
app.correo.remitente=${MAIL_FROM:Jefte Grand <no-responder@jefte-grand.local>}
app.url-panel=${URL_PANEL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
